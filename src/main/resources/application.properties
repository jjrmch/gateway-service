spring.application.name=gateway-service
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.cloud.gateway.server.webmvc.routes[0].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://catalog-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/libros/**

spring.cloud.gateway.server.webmvc.routes[1].id=transactions-ventas
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://transactions-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/ventas/**

spring.cloud.gateway.server.webmvc.routes[2].id=transactions-alquileres
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://transactions-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/alquileres/**

spring.cloud.gateway.server.webmvc.routes[5].id=customer-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/clientes/**

# Rutas para exponer la documentación de cada servicio a través del gateway
spring.cloud.gateway.server.webmvc.routes[3].id=catalog-docs
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://catalog-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/catalog-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[4].id=transactions-docs
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://transactions-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/transactions-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[6].id=customer-docs
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/customer-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=1


# Swagger UI del gateway: agrega los docs de cada servicio
springdoc.swagger-ui.urls[0].name=Catalog Service
springdoc.swagger-ui.urls[0].url=/catalog-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Transactions Service
springdoc.swagger-ui.urls[1].url=/transactions-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Customer Service
springdoc.swagger-ui.urls[2].url=/customer-service/v3/api-docs